<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrewDiary – Coffee Brewing Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">🫘 BrewDiary</div>
  <nav>
    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
    <button class="nav-btn" data-view="entries">Brew Log</button>
  </nav>
</aside>

<main>
  <section id="dashboard" class="view active">
    <h1>Dashboard</h1>
    <div class="cards" id="stats"></div>
    <div class="panel">
      <h2>Brews by Method</h2>
      <div id="methodBars"></div>
    </div>
    <div class="panel">
      <h2>Latest Brews</h2>
      <ul class="list" id="latestList"></ul>
    </div>
  </section>

  <section id="entries" class="view">
    <div class="head"><h1>Brew Log</h1><button class="btn" id="addBrewBtn">+ Log a Brew</button></div>
    <div class="filters">
      <input type="search" id="searchBrew" placeholder="Search bean, origin, notes…" aria-label="Search brews">
      <select id="filterMethod" aria-label="Filter by method"></select>
    </div>
    <div id="brewList" class="brew-list"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <form class="modal-box" id="form">
    <h2 id="formTitle">Log a Brew</h2>
    <label>Bean name <input id="f_bean" required maxlength="50" placeholder="e.g. Benguet Arabica"></label>
    <div class="row">
      <label>Origin <input id="f_origin" maxlength="40" placeholder="e.g. Sagada, PH"></label>
      <label>Roast <select id="f_roast"><option>Light</option><option selected>Medium</option><option>Dark</option></select></label>
    </div>
    <label>Method <select id="f_method">
      <option>Pour Over</option><option>French Press</option><option>Espresso</option><option>Aeropress</option><option>Cold Brew</option><option>Moka Pot</option>
    </select></label>
    <div class="row">
      <label>Dose (g) <input id="f_dose" type="number" min="0.1" step="any" required></label>
      <label>Water (ml) <input id="f_water" type="number" min="0.1" step="any" required></label>
      <label>Brew time (sec) <input id="f_time" type="number" min="0" step="1"></label>
    </div>
    <label>Rating
      <div class="stars" id="starPicker" data-value="3">
        <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
      </div>
    </label>
    <label>Notes <textarea id="f_notes" rows="2" maxlength="150" placeholder="Tasting notes…"></textarea></label>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button class="btn">Save brew</button>
    </div>
  </form>
</div>

<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
